<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="icon" href="/assets/favicon.png" />

    <title>Cross-Platform Korea</title>

    <!-- Naver Search Advisor site verification -->
    <meta name="naver-site-verification" content="55e7dc5a139e45c25e1add8d6f57f5c678e2fed9" />

    <meta property="og:image" content="/og-preview.jpg" />

    <!-- PWA Meta Tags with dynamic theme color -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Basic Meta Tags (will be updated dynamically) -->
    <meta name="description" content="한국 크로스플랫폼 개발자 커뮤니티 — React Native, Flutter, Kotlin Multiplatform, Tauri, Electron 등 크로스플랫폼 개발 소식과 Q&A, 쇼케이스를 공유합니다." />
    <meta name="keywords" content="cross-platform, 크로스플랫폼, 개발자 커뮤니티, React Native, Flutter, Kotlin Multiplatform, Tauri, Electron, Expo" />
    <meta name="author" content="Cross-Platform Korea" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Cross-Platform Korea" />
    <meta property="og:description" content="한국 크로스플랫폼 개발자 커뮤니티" />
    <meta property="og:locale" content="ko" />
    <meta property="og:site_name" content="Cross-Platform Korea" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crossplatformkorea.com" />
    <link rel="canonical" href="https://crossplatformkorea.com" />

    <!-- RSS / Atom autodiscovery — lets feed readers and Naver discover the feed -->
    <link rel="alternate" type="application/rss+xml" title="Cross-Platform Korea RSS" href="https://crossplatformkorea.com/rss.xml" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cross-Platform Korea" />
    <meta name="twitter:description" content="한국 크로스플랫폼 개발자 커뮤니티" />
    <meta name="twitter:image" content="https://crossplatformkorea.com/og-preview.jpg" />

    <!-- Sitelinks searchbox + org identity for Google / answer engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Cross-Platform Korea",
        "alternateName": "크로스플랫폼 코리아",
        "url": "https://crossplatformkorea.com",
        "inLanguage": "ko",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://crossplatformkorea.com/posts?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Cross-Platform Korea",
        "alternateName": "크로스플랫폼 코리아",
        "url": "https://crossplatformkorea.com",
        "logo": "https://crossplatformkorea.com/assets/favicon.png",
        "sameAs": [
          "https://www.youtube.com/@crossplatformkorea",
          "https://github.com/crossplatformkorea"
        ]
      }
    </script>

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />

    <!-- Theme initialization script to prevent FOUC -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        const html = document.documentElement;
        
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          html.classList.add('dark');
          html.classList.remove('light');
        } else {
          html.classList.add('light');
          html.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
