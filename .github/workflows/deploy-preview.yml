name: Deploy Web Preview
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'convex/**'
      - 'package.json'
      - 'bun.lock'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-preview.yml'
permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.2.21'

      - run: bun install --frozen-lockfile

      # `secrets` is not usable in a step `if:`, so decide here.
      - name: Check for a Convex preview deploy key
        id: convex
        env:
          PREVIEW_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          if [ -n "$PREVIEW_KEY" ]; then
            echo 'preview=true' >> "$GITHUB_OUTPUT"
          else
            echo 'preview=false' >> "$GITHUB_OUTPUT"
          fi

      # Give the PR its own backend, so a change to a Convex function is
      # exercised by the preview that contains it. Without this the preview
      # calls whatever is already deployed, and any PR that adds an argument to
      # a query shows that call failing in its own preview until it merges.
      - name: Build against a per-PR Convex preview deployment
        if: ${{ steps.convex.outputs.preview == 'true' }}
        run: >-
          bunx convex deploy
          --cmd 'bun run build:web'
          --cmd-url-env-var-name VITE_CONVEX_URL
          --preview-create "pr-${{ github.event.pull_request.number }}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      # Fallback while CONVEX_PREVIEW_DEPLOY_KEY is unset: previous behaviour,
      # so adding this workflow change does not break previews on its own.
      - name: Build against the existing deployment
        if: ${{ steps.convex.outputs.preview == 'false' }}
        run: bun run build:web
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CROSS_PLATFORM_KOREA_73395 }}
          firebaseToolsVersion: '15.28.2'
          projectId: cross-platform-korea-73395
